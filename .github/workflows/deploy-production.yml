name: Deploy Production

# Nur manuell. Bricht ab, solange [env.production] in wrangler.toml
# Platzhalter-IDs oder fehlende Bindings enthaelt (check-prod-config).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check production config
        run: node scripts/check-prod-config.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: D1 Migrations apply (production)
        # Ausgabe gefiltert: das Repo ist oeffentlich, seine Logs auch. Konto-ID und
        # workers.dev-Adresse gehoeren nicht hinein (pipefail haelt den Exitcode).
        shell: bash
        run: set -o pipefail; pnpm wrangler d1 migrations apply DB --remote --env production 2>&1 | sed -E -e 's#[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev#<worker>.<sub>.workers.dev#g' -e 's#\b[0-9a-f]{32}\b#<konto-id>#g'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        shell: bash
        run: set -o pipefail; pnpm wrangler deploy --env production --var GIT_COMMIT:${{ github.sha }} 2>&1 | sed -E -e 's#[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev#<worker>.<sub>.workers.dev#g' -e 's#\b[0-9a-f]{32}\b#<konto-id>#g'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
