name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Voraussetzung: CLOUDFLARE_API_TOKEN im Environment staging (verteilt vom
# Schluesselspeicher). Eine Konto-ID braucht es nicht: der Token gilt fuer genau ein Konto.
# Wenn die Secrets nicht gesetzt sind, schlägt der Job mit einer klaren
# Fehlermeldung fehl statt mit kryptischem wrangler-Error.

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        id: check

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: pnpm test

      - name: D1 Migrations apply (staging)
        if: steps.check.outputs.skip != 'true'
        # Ausgabe gefiltert wie in deploy-production.yml: die Logs sind oeffentlich.
        shell: bash
        run: set -o pipefail; pnpm wrangler d1 migrations apply DB --remote --env staging 2>&1 | sed -E -e 's#[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev#<worker>.<sub>.workers.dev#g' -e 's#\b[0-9a-f]{32}\b#<konto-id>#g'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: set -o pipefail; pnpm wrangler deploy --env staging --var GIT_COMMIT:${{ github.sha }} 2>&1 | sed -E -e 's#[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev#<worker>.<sub>.workers.dev#g' -e 's#\b[0-9a-f]{32}\b#<konto-id>#g'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke (post-deploy)
        if: steps.check.outputs.skip != 'true'
        # Die Adresse steht als Variable im Environment, nie im Repo; fehlt sie, entfaellt der Smoke.
        env:
          STAGING_URL: ${{ vars.GROSSHANDEL_STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then echo "GROSSHANDEL_STAGING_URL nicht gesetzt, Smoke entfaellt"; exit 0; fi
          curl -fsS "$STAGING_URL/health" > /dev/null || (echo "smoke failed"; exit 1)
          echo "health ok"
        continue-on-error: true
