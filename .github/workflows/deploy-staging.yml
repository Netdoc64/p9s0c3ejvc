name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Voraussetzung: Repository-Secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# Wenn die Secrets nicht gesetzt sind, schlägt der Job mit einer klaren
# Fehlermeldung fehl statt mit kryptischem wrangler-Error.

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        id: check

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.check.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: pnpm test

      - name: D1 Migrations apply (staging)
        if: steps.check.outputs.skip != 'true'
        run: pnpm wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: pnpm wrangler deploy --env staging --var GIT_COMMIT:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke (post-deploy)
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -fsSL https://staging.api.grosshandel.app/health || (echo "smoke failed"; exit 1)
          curl -fsSL https://staging.api.grosshandel.app/openapi.json | head -c 200
        continue-on-error: true
